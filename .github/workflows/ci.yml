name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/check-contrast.mjs
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ci
          VITE_FIREBASE_AUTH_DOMAIN: ci
          VITE_FIREBASE_PROJECT_ID: ci
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Fails the build if a key, service account or SMTP URL is committed.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Production dependencies only; dev tooling advisories are tracked separately (audit F-12).
      - run: npm audit --omit=dev --audit-level=high
        working-directory: client
      - run: npm audit --omit=dev --audit-level=high
        working-directory: functions
